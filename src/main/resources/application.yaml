spring:
  application:
    name: api-gateway
  profiles:
    active: dev
  config:
    import: "optional:configserver:http://localhost:8085"
  cloud:
    compatibility-verifier:
      enabled: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8065/eureka/}